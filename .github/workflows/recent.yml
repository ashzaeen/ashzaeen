name: Refresh recent activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/recent.sh", ".github/workflows/recent.yml"]

permissions:
  contents: write

concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the recent-activity table
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SELF: ${{ github.event.repository.name }}
        run: bash .github/scripts/recent.sh

      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh recent activity"
          git pull --rebase -q
          git push
